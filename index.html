<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авторски надзор</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --panel:#fff; --bad:#b3261e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--ink); font:13px/1.45 Ubuntu, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h2 { font-size:12px; margin:14px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .top h1 { margin-right:auto; }
  .status { font-size:12px; color:var(--muted); margin-bottom:8px; min-height:1.4em; }
  .status.bad { color:var(--bad); }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  button { font:inherit; padding:5px 9px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  button.small { padding:2px 8px; font-size:12px; }
  button.ok { background:#2E7D32; border-color:#2E7D32; }
  button.rem { background:#7CB342; border-color:#7CB342; }
  button.no { background:#C62828; border-color:#C62828; }
  select, input[type=text], textarea { font:inherit; font-size:12px; padding:3px 5px; border:1px solid var(--line); background:#fff; border-radius:0; }
  textarea { width:100%; min-height:48px; resize:vertical; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs button { background:transparent; color:var(--ink); border-color:var(--line); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .card { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c); padding:8px; margin-bottom:8px; }
  .card .hd { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .card .hd b { font-size:13.5px; }
  .card .st { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--c); }
  .sub { font-size:11px; color:var(--muted); }
  .bad { color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:4px; margin:6px 0; }
  .th { aspect-ratio:1; background:#ece8df; cursor:pointer; overflow:hidden; border:0; padding:0; }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .box { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:50; display:flex; flex-direction:column; padding:8px; color:#fff; }
  .box .zview { flex:1; min-height:0; overflow:hidden; display:flex; cursor:zoom-in; }
  .box .zview img { flex:1; min-height:0; min-width:0; object-fit:contain; width:100%; }
  .box .zview.zoom { display:block; overflow:auto; cursor:zoom-out; }
  .box .zview.zoom img { width:auto; height:auto; max-width:none; flex:none; }
  .box a.open { font-size:12px; padding:2px 8px; background:#fff; color:#1f1f1f; border:1px solid #fff; text-decoration:none; }
  .box .meta { font-size:12px; padding:6px 0; }
  .box button { background:#fff; color:#1f1f1f; border-color:#fff; }
  .view { background:var(--panel); border:1px solid var(--line); padding:6px 8px; margin:6px 0; }
  .legend { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:11px; margin-top:4px; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.25); }
  label.chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; }
  .log { white-space:pre-wrap; font-size:10.5px; color:var(--muted); margin-top:4px; }
  /* decisions (sweep 18.11.2026): final, so larger buttons set apart, a tap arms ("Потвърди: …"), a second tap saves */
  .bar.decide { gap:12px; }
  button.dec { padding:5px 12px; font-size:12px; }
  button.dec.armed { outline:3px solid var(--accent); outline-offset:1px; font-weight:600; }
  button:disabled, textarea:disabled { opacity:.55; cursor:default; }
  .saving { color:var(--ink); font-weight:600; margin-top:4px; }
  .cerr { margin-top:2px; }
  textarea[aria-invalid=true] { border-color:var(--bad); }
  /* result toast at the bottom (sweep 18.11.2026, as in Монолитен бетон): always in the DOM for screen readers, visually
     hidden when idle; taps pass through */
  body { padding-bottom:calc(56px + env(safe-area-inset-bottom, 0px)); }
  .toast { position:fixed; left:8px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); z-index:40; max-width:min(85%, 420px);
    padding:8px 10px; font-size:13px; color:#fff; pointer-events:none; }
  .toast:not(.show) { width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
  .toast.ok { background:#2E7D32; }
  .toast.bad { background:var(--bad); }
  /* touch screens: ~40 px targets, 16 px inputs (no iOS zoom), as in Монолитен бетон */
  @media (pointer: coarse) {
    button, button.small, select, input[type=text] { min-height:40px; }
    button.small { padding:6px 12px; font-size:14px; }
    button.dec { min-height:40px; padding:8px 14px; font-size:14px; }
    select, input[type=text], textarea { font-size:16px; }
    input[type=checkbox] { width:22px; height:22px; }
    label.chk { min-height:40px; font-size:14px; }
  }
</style>
</head>
<body>
<div class="top"><h1 id="title">Авторски надзор</h1>
  <select id="selLang" title="Language / Език"><option value="bg">BG</option><option value="en">EN</option></select></div>
<button type="button" class="small secondary" data-arsten-diag style="float:right;margin-left:6px">Копирай диагностика</button>
<div id="status" class="status">Trimble Connect…</div>
<div id="main" hidden>
  <div class="bar"><div class="tabs" id="tabs"></div><input type="text" id="filter" style="flex:1;min-width:90px"><button class="small secondary" id="btnReload">Обнови</button></div>
  <div class="view"><div class="bar" style="margin:0"><label class="chk"><input type="checkbox" id="chkColour"> <span id="lblColour">Оцвети по приемане</span></label>
    <select id="selStep"></select></div><div class="legend" id="legend"></div></div>
  <div id="who" class="sub"></div>
  <div id="list"></div>
</div>
<div id="lightbox"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-perf.js?v=21f7454938"></script>
<script src="arsten-diag.js?v=bb0c6351fe"></script>
<script src="arsten-i18n.js?v=c58f01c9fc"></script>
<script src="arsten-access.js?v=fad565fcbe"></script>
<script src="psetapi.js?v=527efaf855"></script>
<script src="arsten-photos.js?v=58db357146"></script>
<script src="arsten-acceptance.js?v=f8e113bc4d"></script>
<script src="app.js?v=22a0c85747"></script>
</body>
</html>
